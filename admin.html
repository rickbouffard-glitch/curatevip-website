<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CURATEvip — Admin</title>
  <link rel="icon" type="image/png" href="C-IconNoBg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #ba9f75; --gold-dim: rgba(186,159,117,0.5); --bg: #0c0c0d; --surface: #111113; }
    body { background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── Auth screens ── */
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(186,159,117,0.10) 0%, #0c0c0d 60%);
      padding: 32px 20px;
    }
    .auth-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(186,159,117,0.18);
      border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 400px;
    }
    .auth-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 28px; letter-spacing: 0.25em;
      color: var(--gold); text-align: center; margin-bottom: 6px; font-weight: 500;
    }
    .auth-subtitle {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); text-align: center; margin-bottom: 36px;
    }
    .auth-label {
      display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold-dim); font-weight: 700; margin-bottom: 8px;
    }
    .auth-input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px;
      outline: none; transition: border-color 0.2s; margin-bottom: 18px;
    }
    .auth-input:focus { border-color: var(--gold-dim); }
    .auth-btn {
      width: 100%; background: none; border: 1px solid rgba(186,159,117,0.4);
      border-radius: 40px; padding: 13px; color: var(--gold); font-size: 11px;
      letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, border-color 0.2s; margin-top: 4px;
    }
    .auth-btn:hover { background: rgba(186,159,117,0.1); border-color: var(--gold); }
    .auth-error {
      background: rgba(255,80,80,0.08); border: 1px solid rgba(255,80,80,0.2);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: rgba(255,120,120,0.9); margin-bottom: 18px; display: none;
    }
    .auth-success {
      background: rgba(76,175,125,0.08); border: 1px solid rgba(76,175,125,0.2);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: rgba(76,175,125,0.9); margin-bottom: 18px; display: none;
    }

    /* ── Docs layout ── */
    #screen-docs { display: none; }
    .docs-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12,12,13,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
    }
    .docs-header-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      color: var(--gold); letter-spacing: 0.2em; font-weight: 500;
    }
    .docs-header-actions { display: flex; gap: 16px; align-items: center; }
    .header-btn {
      background: none; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
      padding: 6px 16px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.45); cursor: pointer; transition: all 0.2s;
    }
    .header-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .docs-body { max-width: 760px; margin: 0 auto; padding: 40px 28px 100px; }

    /* ── Sections ── */
    .section { margin-bottom: 44px; }
    .section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .section-num { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--gold-dim); letter-spacing: 0.2em; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: #fff; }
    .section-body {
      background: #000; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 22px 24px;
    }
    .section-body.gold { border-left: 3px solid var(--gold); }
    .section-body.blue { border-left: 3px solid #4ab8e8; }
    .section-body.green { border-left: 3px solid #4caf7d; }
    .section-body.purple { border-left: 3px solid #bf7fff; }
    .section-body.orange { border-left: 3px solid #e8934a; }
    .section-body.red { border-left: 3px solid rgba(255,100,100,0.7); }
    .section-body.amber { border-left: 3px solid #c9a96e; }

    .subhead {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(186,159,117,0.6); margin: 20px 0 10px; font-weight: 700;
    }
    .row { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .row-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(186,159,117,0.55); font-weight: 700; margin-bottom: 5px; }
    .row-value { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; }
    .callout {
      background: rgba(186,159,117,0.05); border: 1px solid rgba(186,159,117,0.15);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
    }
    .callout.red-bg { background: rgba(255,100,100,0.04); border-color: rgba(255,100,100,0.12); }
    .callout.green-bg { background: rgba(76,175,125,0.06); border-color: rgba(76,175,125,0.2); }
    .callout.blue-bg { background: rgba(74,184,232,0.05); border-color: rgba(74,184,232,0.2); }
    .callout.gold-hi { border-color: rgba(186,159,117,0.3); }
    .callout p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.7; margin-bottom: 10px; }
    .callout p:last-child { margin-bottom: 0; }
    .callout .serif { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #fff; line-height: 1.55; font-style: italic; }
    .check-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; line-height: 1.5; }
    .check-item .pass { color: #4caf7d; flex-shrink: 0; }
    .check-item .fail { color: rgba(255,100,100,0.7); flex-shrink: 0; }
    .check-item .text-pass { color: rgba(255,255,255,0.65); }
    .check-item .text-fail { color: rgba(255,255,255,0.35); }
    .env-rule { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .env-name { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 5px; font-weight: 700; }
    .env-def { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.55; margin-bottom: 5px; }
    .env-dis { font-size: 12px; color: rgba(255,100,100,0.6); line-height: 1.5; }
    code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; }
    .gold { color: var(--gold); }
    .white { color: rgba(255,255,255,0.8); }
    .muted { color: rgba(255,255,255,0.4); }
    .italic { font-style: italic; }
    strong { color: rgba(255,255,255,0.8); font-weight: 600; }

    /* Pipeline flow */
    .pipeline { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; margin-bottom: 32px; padding-bottom: 8px; }
    .pipe-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 80px; }
    .pipe-circle {
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    }
    .pipe-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-align: center; color: #fff; }
    .pipe-sub { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 0.04em; text-align: center; }
    .pipe-arrow { width: 24px; height: 1px; background: rgba(255,255,255,0.12); flex-shrink: 0; margin-top: 22px; }

    /* New badge */
    .new-badge { display: inline-block; background: rgba(76,175,125,0.15); border: 1px solid rgba(76,175,125,0.35); border-radius: 4px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #4caf7d; padding: 1px 6px; margin-left: 8px; vertical-align: middle; font-weight: 700; }
    .updated-badge { display: inline-block; background: rgba(186,159,117,0.12); border: 1px solid rgba(186,159,117,0.3); border-radius: 4px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding: 1px 6px; margin-left: 8px; vertical-align: middle; font-weight: 700; }

    /* Password modal */
    #modal-pw {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-pw.open { display: flex; }
    .modal-card {
      background: #111113; border: 1px solid rgba(186,159,117,0.2); border-radius: 16px;
      padding: 36px 32px; width: 100%; max-width: 380px;
    }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #fff; margin-bottom: 24px; }
    .modal-close { float: right; background: none; border: none; color: rgba(255,255,255,0.3); font-size: 20px; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: #fff; }

    /* Code block */
    .code-block {
      background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 14px 16px; font-family: 'SF Mono','Fira Code',monospace;
      font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.8; overflow-x: auto;
    }
    .kw { color: #7ab0ff; }
    .str { color: #c47aff; }

    /* Filter chain */
    .filter-chain { display: flex; flex-direction: column; gap: 0; }
    .filter-step { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .filter-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
    .filter-content .filter-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .filter-content .filter-detail { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; }

    /* Docs intro */
    .docs-intro { margin-bottom: 40px; }
    .docs-intro-tag { font-size: 10px; letter-spacing: 0.28em; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 10px; }
    .docs-intro-title { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; color: #fff; margin-bottom: 12px; line-height: 1.1; }
    .docs-intro-body { font-size: 14px; color: rgba(255,255,255,0.4); line-height: 1.75; max-width: 580px; }

    /* Updated marker in page header */
    .docs-updated { font-size: 10px; letter-spacing: 0.12em; color: rgba(186,159,117,0.4); text-transform: uppercase; margin-top: 4px; }

    /* ── Tab system ── */
    .tab-nav {
      display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 0 28px; background: rgba(12,12,13,0.97);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 12px 20px 11px; font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.3); cursor: pointer;
      transition: color 0.2s, border-color 0.2s; margin-bottom: -1px;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.6); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── IP Methodology extras ── */
    .ip-intro { margin-bottom: 44px; }
    .ip-intro-eyebrow { font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,100,100,0.5); margin-bottom: 8px; }
    .ip-intro-title { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 600; color: #fff; margin-bottom: 10px; line-height: 1.1; }
    .ip-intro-sub { font-size: 13px; color: rgba(255,255,255,0.38); line-height: 1.75; max-width: 580px; margin-bottom: 18px; }
    .confidential-banner {
      background: rgba(255,80,80,0.05); border: 1px solid rgba(255,80,80,0.18);
      border-radius: 10px; padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start;
      margin-bottom: 40px;
    }
    .confidential-banner .cb-icon { color: rgba(255,100,100,0.7); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .confidential-banner .cb-text { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.65; }
    .confidential-banner strong { color: rgba(255,100,100,0.7); }

    .axis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .axis-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px 18px; }
    .axis-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; font-weight: 700; }
    .axis-value { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #fff; margin-bottom: 6px; }
    .axis-desc { font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.55; }

    .tier-block { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .tier-name { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
    .tier-def { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: rgba(255,255,255,0.85); line-height: 1.55; margin-bottom: 8px; font-style: italic; }
    .tier-test { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.6; margin-bottom: 6px; }
    .tier-dis { font-size: 12px; color: rgba(255,100,100,0.55); line-height: 1.55; }

    .worked-example { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 22px 24px; margin-bottom: 20px; }
    .we-venue { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #fff; margin-bottom: 4px; }
    .we-location { font-size: 11px; letter-spacing: 0.14em; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 14px; }
    .we-step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .we-step-num { width: 22px; height: 22px; border-radius: 50%; background: rgba(186,159,117,0.12); border: 1px solid rgba(186,159,117,0.25); color: var(--gold); font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .we-step-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(186,159,117,0.55); font-weight: 700; margin-bottom: 4px; }
    .we-step-text { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.6; }
    .we-verdict { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; background: rgba(186,159,117,0.06); border-radius: 8px; padding: 12px 14px; }
    .we-verdict-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
    .we-verdict-text { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.55; }
    .we-verdict-no { background: rgba(255,80,80,0.05); }
    .we-verdict-no .we-verdict-label { color: rgba(255,100,100,0.7); }

    .decision-step { display: flex; gap: 14px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .decision-num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--gold-dim); color: var(--gold); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .decision-q { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 5px; font-weight: 500; }
    .decision-detail { font-size: 12px; color: rgba(255,255,255,0.38); line-height: 1.6; }
    .decision-pass { font-size: 11px; color: #4caf7d; margin-top: 4px; }
    .decision-fail { font-size: 11px; color: rgba(255,100,100,0.6); margin-top: 4px; }

    .version-row { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .version-tag { font-size: 10px; letter-spacing: 0.1em; background: rgba(186,159,117,0.1); border: 1px solid rgba(186,159,117,0.2); border-radius: 4px; padding: 2px 8px; color: var(--gold); font-weight: 700; flex-shrink: 0; height: fit-content; margin-top: 2px; }
    .version-date { font-size: 10px; color: rgba(255,255,255,0.25); margin-bottom: 4px; }
    .version-notes { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.6; }

    .moat-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .moat-title { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; font-weight: 600; margin-bottom: 6px; }
    .moat-detail { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.65; }
    .moat-why { font-size: 12px; color: rgba(186,159,117,0.6); margin-top: 6px; font-style: italic; }

    @media (max-width: 600px) {
      .auth-card { padding: 32px 24px; }
      .docs-body { padding: 28px 18px 80px; }
      .docs-header { padding: 12px 18px; }
      .tab-nav { padding: 0 14px; position: sticky; top: 0; }
      .axis-grid { grid-template-columns: 1fr; }
    }

    /* ── Users modal ── */
    #modal-users { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px; }
    #modal-users.open { display:flex; }
    .users-card { background:#111113; border:1px solid rgba(186,159,117,0.2); border-radius:20px; padding:36px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; position:relative; }
    .users-title { font-family:"Cormorant Garamond",serif; font-size:20px; color:var(--gold); letter-spacing:0.18em; margin-bottom:24px; }
    .user-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
    .user-row:last-child { border-bottom:none; }
    .user-name { font-size:14px; color:rgba(255,255,255,0.8); }
    .user-date { font-size:11px; color:rgba(255,255,255,0.25); margin-top:2px; }
    .user-actions { display:flex; gap:8px; }
    .user-btn { background:none; border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:4px 12px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
    .user-btn.reset { color:rgba(186,159,117,0.7); }
    .user-btn.reset:hover { border-color:var(--gold-dim); color:var(--gold); }
    .user-btn.del { color:rgba(255,80,80,0.5); }
    .user-btn.del:hover { border-color:rgba(255,80,80,0.4); color:rgba(255,100,100,0.9); }
    .users-divider { border:none; border-top:1px solid rgba(255,255,255,0.08); margin:20px 0; }
    .users-section-label { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-dim); font-weight:700; margin-bottom:14px; }
    .users-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    #users-reset-section { display:none; }
    #users-reset-section.visible { display:block; }
    .users-reset-target { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:10px; }
    .users-reset-target strong { color:rgba(255,200,120,0.85); }

  </style>
</head>
<body>

<!-- Setup screen removed — credentials are pre-seeded on first visit -->

<!-- ══════════════════════ LOGIN SCREEN ══════════════════════ -->
<div id="screen-login" class="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">CURATE</div>
    <div class="auth-subtitle">Private — Authorized Access Only</div>
    <div id="login-error" class="auth-error"></div>
    <label class="auth-label">Username</label>
    <input id="login-user" class="auth-input" type="text" autocomplete="username" placeholder="">
    <label class="auth-label">Password</label>
    <input id="login-pass" class="auth-input" type="password" autocomplete="current-password" placeholder="">
    <!-- Shown only when this page is not configured for Supabase sign-in.
         See the DOCS API CREDENTIAL block in the script below. -->
    <!-- The ADMIN API SECRET field lived here until 2026-08-27. Removed with the
         fallback that needed it: reading documentation should never have
         required handling ADMIN_SCRIPT_SECRET, which unlocks every admin
         route. Sign-in now uses /api/docs/session and the username and
         password already collected above. -->
    <button class="auth-btn" onclick="handleLogin()">Sign In</button>
  </div>
</div>

<!-- ══════════════════════ PASSWORD MODAL ══════════════════════ -->
<div id="modal-pw">
  <div class="modal-card">
    <button class="modal-close" onclick="closePwModal()">&times;</button>
    <div class="modal-title">Change Password</div>
    <div id="pw-error" class="auth-error"></div>
    <div id="pw-success" class="auth-success"></div>
    <label class="auth-label">Current Password</label>
    <input id="pw-current" class="auth-input" type="password" placeholder="">
    <label class="auth-label">New Password</label>
    <input id="pw-new" class="auth-input" type="password" placeholder="min 8 characters">
    <label class="auth-label">Confirm New Password</label>
    <input id="pw-confirm" class="auth-input" type="password" placeholder="">
    <button class="auth-btn" onclick="handlePwChange()">Update Password</button>
  </div>
</div>


<!-- ══════════════════════ USERS MODAL ══════════════════════ -->
<div id="modal-users">
  <div class="users-card">
    <button class="modal-close" onclick="closeUsersModal()">&times;</button>
    <div class="users-title">Manage Access</div>
    <div id="users-error" class="auth-error"></div>
    <div id="users-success" class="auth-success"></div>

    <!-- Current users list -->
    <div class="users-section-label">Current Users</div>
    <div id="users-list"><div style="font-size:13px;color:rgba(255,255,255,0.3);padding:8px 0;">Loading…</div></div>

    <hr class="users-divider">

    <!-- Add new user -->
    <div class="users-section-label">Add New User</div>
    <div class="users-grid">
      <div>
        <label class="auth-label">Username</label>
        <input id="new-user-name" class="auth-input" type="text" placeholder="e.g. sarah" autocomplete="off">
      </div>
      <div>
        <label class="auth-label">Initial Password</label>
        <input id="new-user-pass" class="auth-input" type="password" placeholder="min 8 characters">
      </div>
    </div>
    <button class="auth-btn" onclick="handleCreateUser()" style="margin-bottom:0;">Create User</button>

    <!-- Reset password for another user -->
    <div id="users-reset-section">
      <hr class="users-divider">
      <div class="users-section-label">Reset Password</div>
      <div class="users-reset-target">Resetting password for: <strong id="reset-target-name"></strong></div>
      <label class="auth-label">New Password</label>
      <input id="reset-new-pass" class="auth-input" type="password" placeholder="min 8 characters">
      <div style="display:flex;gap:10px;">
        <button class="auth-btn" onclick="handleResetPassword()" style="flex:1;margin-bottom:0;">Set Password</button>
        <button class="auth-btn" onclick="cancelReset()" style="flex:0 0 auto;width:auto;padding:13px 20px;margin-bottom:0;color:rgba(255,255,255,0.3);">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════ DOCS SCREEN ══════════════════════ -->
<div id="screen-docs"><!-- content loaded from GET /api/docs/admin after sign-in --></div>

<script>
  const API = 'https://api.curatevip.ai';

  // ══════════════════════ DOCS API CREDENTIAL ══════════════════════
  // The documentation body is NOT in this file. It used to be: all 54 sections
  // shipped in the HTML to every anonymous visitor and were "protected" only by
  // a CSS display toggle, so `curl https://curatevip.app/admin.html` returned
  // the entire methodology. The body now comes from GET /api/docs/admin, which
  // sits behind the API's server-side requireAdmin check.
  //
  // requireAdmin accepts exactly two credentials, and this page must present
  // one of them:
  //   (a) Authorization: Bearer <Supabase session token> for a member with
  //       is_admin = true (preferred), or
  //   (b) x-docs-token: issued by POST /api/docs/session against the same
  //       username and password as above. Scoped to /api/docs only.
  //
  // (a) is off by default because this site has no Supabase configuration of
  // its own — no client library, no project URL, no anon key. To turn it on,
  // paste the project URL and the ANON (publishable) key below; never the
  // service-role key. The sign-in then goes straight to the GoTrue REST
  // endpoint, so no third-party script is loaded into a page that guards trade
  // secrets. Note the identity sets differ: the Username/Password below are
  // admin_credentials rows, while a Supabase token must belong to a member with
  // is_admin = true (or an ADMIN_EMAILS address).
  //
  // With these blank, the page falls back to (b): the operator types the admin
  // API secret at sign-in. It is held in a variable for the life of the tab and
  // is never written to sessionStorage, localStorage or a cookie — reloading
  // the page requires signing in again, which is the intended trade for not
  // parking a server-to-server secret in browser storage.
  const SUPABASE_URL      = '';
  const SUPABASE_ANON_KEY = '';
  const USE_SUPABASE      = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

  // In-memory only. Never persisted.
  let docsAuthHeaders = null;

  // ── SHA-256 helper ──────────────────────────────────────────────────────────
  async function sha256(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ── Show/hide screens ───────────────────────────────────────────────────────
  function showScreen(name) {
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-docs').style.display = 'none';
    if (name === 'login') document.getElementById('screen-login').style.display = 'flex';
    if (name === 'docs')  document.getElementById('screen-docs').style.display = 'block';
  }

  function showAuthError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearAuthError(id) {
    const el = document.getElementById(id);
    el.style.display = 'none';
    el.textContent = '';
  }

  // ── Docs content loading ────────────────────────────────────────────────────
  // Signs in to Supabase directly against the GoTrue REST API and returns the
  // session bearer token. Only used when SUPABASE_URL / SUPABASE_ANON_KEY are
  // configured above.
  async function supabaseSignIn(email, password) {
    const res = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token) return null;
    return data.access_token;
  }

  // Fetches the doc body and injects it. Returns an error string on failure and
  // null on success. There is deliberately no embedded copy to fall back to:
  // if the API will not serve the content, the page shows nothing.
  async function loadDocsContent(headers) {
    let res;
    try {
      res = await fetch(API + '/api/docs/admin', { headers, cache: 'no-store' });
    } catch (err) {
      return 'Could not reach the documentation service. Check your connection.';
    }
    if (res.status === 401) return 'Not authorized for documentation access.';
    if (res.status === 403) return 'This account does not have admin access.';
    if (!res.ok)            return 'Documentation is unavailable (error ' + res.status + ').';

    let data;
    try { data = await res.json(); } catch (err) { return 'Documentation response was malformed.'; }
    if (!data || !data.ok || !data.html) return 'Documentation response was empty.';

    document.getElementById('screen-docs').innerHTML = data.html;
    return null;
  }

  // ── Login ───────────────────────────────────────────────────────────────────
  async function handleLogin() {
    clearAuthError('login-error');
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!user || !pass) { showAuthError('login-error', 'Username and password required.'); return; }

    const btn = document.querySelector('#screen-login .auth-btn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    try {
      // Step 1 — the existing admin_credentials check. Server-side, against a
      // hash this page never receives.
      const hash = await sha256(pass);
      const res = await fetch(API + '/api/admin-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, passwordHash: hash })
      });
      const data = await res.json();
      if (!data.ok) { showAuthError('login-error', 'Invalid credentials.'); return; }

      // Step 2 — obtain a credential the docs API itself will accept.
      //
      // CHANGED 2026-08-27. This used to ask a human to paste
      // ADMIN_SCRIPT_SECRET into the form whenever the Supabase constants were
      // unset — which they were, so that was the live path. It was the wrong
      // trade twice over: ADMIN_SCRIPT_SECRET unlocks every admin route, so
      // reading documentation required handling the most privileged key in the
      // system, and it made a person memorise a secret to do the least
      // sensitive thing anyone does here.
      //
      // /api/docs/session exchanges the SAME username and password already
      // verified above for a docs-only token: scoped to /api/docs, HMAC-signed
      // server-side, 8-hour expiry, and not accepted by requireAdmin — so it
      // cannot read a member row even if it leaks.
      let headers;
      if (USE_SUPABASE) {
        const token = await supabaseSignIn(user, pass);
        if (!token) { showAuthError('login-error', 'Could not establish an admin session.'); return; }
        headers = { 'Authorization': 'Bearer ' + token };
      } else {
        const sres  = await fetch(API + '/api/docs/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, passwordHash: hash })
        });
        const sdata = await sres.json().catch(() => ({}));
        if (!sres.ok || !sdata.ok || !sdata.token) {
          showAuthError('login-error', sdata.error || 'Could not establish a documentation session.');
          return;
        }
        headers = { 'x-docs-token': sdata.token };
      }

      // Step 3 — the API is the real gate. Only a 200 here reveals anything.
      const err = await loadDocsContent(headers);
      if (err) { showAuthError('login-error', err); return; }

      docsAuthHeaders = headers;
      // Username + hash back the user-management calls, as before. The docs
      // credential itself stays out of storage.
      sessionStorage.setItem('curate_admin_session', crypto.randomUUID());
      sessionStorage.setItem('curate_admin_user', user);
      sessionStorage.setItem('curate_admin_hash', hash);
      document.getElementById('login-pass').value = '';
      showScreen('docs');
    } catch (err) {
      showAuthError('login-error', 'Could not reach server. Check your connection.');
    } finally {
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }

  // ── Sign out ────────────────────────────────────────────────────────────────
  function handleSignOut() {
    sessionStorage.removeItem('curate_admin_session');
    sessionStorage.removeItem('curate_admin_user');
    sessionStorage.removeItem('curate_admin_hash');
    docsAuthHeaders = null;
    // Drop the fetched content from the DOM as well — signing out must leave
    // nothing behind for the next person at the keyboard.
    document.getElementById('screen-docs').innerHTML = '';
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
    showScreen('login');
  }

  // ── Password modal ──────────────────────────────────────────────────────────
  function openPwModal() {
    document.getElementById('modal-pw').classList.add('open');
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    document.getElementById('pw-confirm').value = '';
    clearAuthError('pw-error');
    document.getElementById('pw-success').style.display = 'none';
  }
  function closePwModal() {
    document.getElementById('modal-pw').classList.remove('open');
  }

  async function handlePwChange() {
    clearAuthError('pw-error');
    document.getElementById('pw-success').style.display = 'none';
    const current  = document.getElementById('pw-current').value;
    const newPw    = document.getElementById('pw-new').value;
    const confirm  = document.getElementById('pw-confirm').value;
    const username = sessionStorage.getItem('curate_admin_user') || 'rick';

    if (newPw.length < 8) { showAuthError('pw-error', 'New password must be at least 8 characters.'); return; }
    if (newPw !== confirm) { showAuthError('pw-error', 'New passwords do not match.'); return; }

    const btn = document.querySelector('#modal-pw .auth-btn');
    btn.textContent = 'Updating…';
    btn.disabled = true;

    try {
      const currentHash = await sha256(current);
      const newHash     = await sha256(newPw);
      const res = await fetch(API + '/api/admin-set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, currentHash, newHash })
      });
      const data = await res.json();
      if (data.ok) {
        const s = document.getElementById('pw-success');
        s.textContent = 'Password updated successfully.';
        s.style.display = 'block';
        document.getElementById('pw-current').value = '';
        document.getElementById('pw-new').value = '';
        document.getElementById('pw-confirm').value = '';
      } else {
        showAuthError('pw-error', data.error || 'Update failed.');
      }
    } catch (err) {
      showAuthError('pw-error', 'Could not reach server.');
    } finally {
      btn.textContent = 'Update Password';
      btn.disabled = false;
    }
  }

  // ── Keyboard shortcuts ──────────────────────────────────────────────────────
  // Enter submits from the password field. There is no longer a second field to
  // tab into — the admin API secret input was removed 2026-08-27 when docs
  // sign-in moved to /api/docs/session.
  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('pw-confirm').addEventListener('keydown', e => { if (e.key === 'Enter') handlePwChange(); });

  // ── Close modal on backdrop click ───────────────────────────────────────────
  document.getElementById('modal-pw').addEventListener('click', function(e) {
    if (e.target === this) closePwModal();
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  // ── Tab switching ───────────────────────────────────────────────────────────
  function switchTab(name, btn) {
    document.getElementById('tab-curate').classList.remove('active');
    document.getElementById('tab-system').classList.remove('active');
    document.getElementById('tab-ip').classList.remove('active');
    document.getElementById('tab-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.scrollTo(0, 0);
  }

  (function init() {
    // Always start at the login screen. A stored session no longer implies
    // anything is readable: the content lives on the API and the credential
    // that fetches it is intentionally not persisted, so a reload means a
    // fresh sign-in.
    sessionStorage.removeItem('curate_admin_session');
    sessionStorage.removeItem('curate_admin_user');
    sessionStorage.removeItem('curate_admin_hash');
    showScreen('login');
  })();

  // ── Helper: Basic auth header for user management endpoints ────────────────
  function adminAuthHeader() {
    const user = sessionStorage.getItem('curate_admin_user') || '';
    const hash = sessionStorage.getItem('curate_admin_hash') || '';
    return 'Basic ' + btoa(user + ':' + hash);
  }

  // ── Users modal ─────────────────────────────────────────────────────────────
  let resetTargetUsername = null;

  async function openUsersModal() {
    document.getElementById('modal-users').classList.add('open');
    document.getElementById('users-error').style.display = 'none';
    document.getElementById('users-success').style.display = 'none';
    document.getElementById('new-user-name').value = '';
    document.getElementById('new-user-pass').value = '';
    cancelReset();
    await loadUsersList();
  }

  function closeUsersModal() {
    document.getElementById('modal-users').classList.remove('open');
    cancelReset();
  }

  async function loadUsersList() {
    const listEl = document.getElementById('users-list');
    listEl.innerHTML = '<div style="font-size:13px;color:rgba(255,255,255,0.3);padding:8px 0;">Loading…</div>';
    try {
      const res = await fetch(API + '/api/admin-users', {
        headers: { 'Authorization': adminAuthHeader() }
      });
      const data = await res.json();
      if (!data.ok) { listEl.innerHTML = '<div style="font-size:13px;color:rgba(255,100,100,0.7);padding:8px 0;">Could not load users.</div>'; return; }
      const currentUser = sessionStorage.getItem('curate_admin_user') || '';
      if (!data.users || data.users.length === 0) {
        listEl.innerHTML = '<div style="font-size:13px;color:rgba(255,255,255,0.3);padding:8px 0;">No users found.</div>';
        return;
      }
      listEl.innerHTML = data.users.map(u => {
        const isSelf = u.username === currentUser;
        const date = u.updated_at ? new Date(u.updated_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
        return `<div class="user-row">
          <div>
            <div class="user-name">${u.username}${isSelf ? ' <span style="font-size:10px;color:rgba(186,159,117,0.5);margin-left:6px;">you</span>' : ''}</div>
            ${date ? `<div class="user-date">Password last changed ${date}</div>` : ''}
          </div>
          <div class="user-actions">
            <button class="user-btn reset" onclick="startReset('${u.username}')">Reset PW</button>
            ${!isSelf ? `<button class="user-btn del" onclick="handleDeleteUser('${u.username}')">Delete</button>` : ''}
          </div>
        </div>`;
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<div style="font-size:13px;color:rgba(255,100,100,0.7);padding:8px 0;">Server unreachable.</div>';
    }
  }

  async function handleCreateUser() {
    const usernameEl = document.getElementById('new-user-name');
    const passEl = document.getElementById('new-user-pass');
    const errEl = document.getElementById('users-error');
    const okEl = document.getElementById('users-success');
    errEl.style.display = 'none';
    okEl.style.display = 'none';

    const username = usernameEl.value.trim();
    const pass = passEl.value;
    if (!username) { errEl.textContent = 'Username required.'; errEl.style.display = 'block'; return; }
    if (pass.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }

    const passwordHash = await sha256(pass);
    try {
      const res = await fetch(API + '/api/admin-users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': adminAuthHeader() },
        body: JSON.stringify({ username, passwordHash })
      });
      const data = await res.json();
      if (data.ok) {
        usernameEl.value = '';
        passEl.value = '';
        okEl.textContent = `User "${username}" created. Share their username and initial password with them — they can change it after login.`;
        okEl.style.display = 'block';
        await loadUsersList();
      } else {
        errEl.textContent = data.error || 'Could not create user.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = 'Server unreachable.';
      errEl.style.display = 'block';
    }
  }

  function startReset(username) {
    resetTargetUsername = username;
    document.getElementById('reset-target-name').textContent = username;
    document.getElementById('reset-new-pass').value = '';
    document.getElementById('users-reset-section').classList.add('visible');
    document.getElementById('users-reset-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    document.getElementById('users-error').style.display = 'none';
    document.getElementById('users-success').style.display = 'none';
  }

  function cancelReset() {
    resetTargetUsername = null;
    document.getElementById('users-reset-section').classList.remove('visible');
    document.getElementById('reset-new-pass').value = '';
  }

  async function handleResetPassword() {
    if (!resetTargetUsername) return;
    const passEl = document.getElementById('reset-new-pass');
    const errEl = document.getElementById('users-error');
    const okEl = document.getElementById('users-success');
    errEl.style.display = 'none';
    okEl.style.display = 'none';

    const newPass = passEl.value;
    if (newPass.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }

    const newHash = await sha256(newPass);
    try {
      const res = await fetch(API + `/api/admin-users/${encodeURIComponent(resetTargetUsername)}/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': adminAuthHeader() },
        body: JSON.stringify({ newHash })
      });
      const data = await res.json();
      if (data.ok) {
        okEl.textContent = `Password for "${resetTargetUsername}" has been reset.`;
        okEl.style.display = 'block';
        cancelReset();
        await loadUsersList();
      } else {
        errEl.textContent = data.error || 'Could not reset password.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = 'Server unreachable.';
      errEl.style.display = 'block';
    }
  }

  async function handleDeleteUser(username) {
    if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
    const errEl = document.getElementById('users-error');
    const okEl = document.getElementById('users-success');
    errEl.style.display = 'none';
    okEl.style.display = 'none';
    try {
      const res = await fetch(API + `/api/admin-users/${encodeURIComponent(username)}`, {
        method: 'DELETE',
        headers: { 'Authorization': adminAuthHeader() }
      });
      const data = await res.json();
      if (data.ok) {
        okEl.textContent = `User "${username}" deleted.`;
        okEl.style.display = 'block';
        await loadUsersList();
      } else {
        errEl.textContent = data.error || 'Could not delete user.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = 'Server unreachable.';
      errEl.style.display = 'block';
    }
  }

</script>
</body>
</html>
