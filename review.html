<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CURATEvip — Engineering Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #ba9f75; --gold-dim: rgba(186,159,117,0.5); --bg: #0c0c0d; }
    body {
      background: var(--bg); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Login ── */
    .auth-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(186,159,117,0.08) 0%, #0c0c0d 65%);
      padding: 32px 20px;
    }
    .auth-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(186,159,117,0.18);
      border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 380px;
    }
    .auth-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 26px; letter-spacing: 0.25em;
      color: var(--gold); text-align: center; margin-bottom: 6px; font-weight: 500;
    }
    .auth-subtitle {
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); text-align: center; margin-bottom: 36px;
    }
    .auth-field {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 13px 16px; font-size: 14px; color: #fff;
      outline: none; font-family: inherit; margin-bottom: 12px; transition: border-color 0.2s;
    }
    .auth-field:focus { border-color: rgba(186,159,117,0.4); }
    .auth-btn {
      width: 100%; margin-top: 4px;
      background: rgba(186,159,117,0.1); border: 1px solid rgba(186,159,117,0.3);
      border-radius: 10px; padding: 13px; color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; font-family: inherit; transition: background 0.2s;
    }
    .auth-btn:hover { background: rgba(186,159,117,0.16); }
    .auth-error {
      font-size: 12px; color: #e57373; text-align: center;
      margin-top: 12px; letter-spacing: 0.04em; min-height: 18px;
    }

    /* ── Viewer ── */
    .viewer { display: none; flex-direction: column; min-height: 100vh; }
    .viewer.active { display: flex; }

    .viewer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .viewer-wordmark {
      font-family: 'Cormorant Garamond', serif; font-size: 16px;
      letter-spacing: 0.22em; color: var(--gold); font-weight: 500;
    }
    .viewer-wordmark span {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10px; letter-spacing: 0.15em; color: rgba(255,255,255,0.2);
      font-weight: 400; margin-left: 10px;
    }

    .tab-strip {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 40px; padding: 5px;
    }
    .tab-btn {
      background: transparent; border: 1px solid transparent; border-radius: 30px;
      color: rgba(255,255,255,0.3); font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 20px;
      cursor: pointer; font-family: inherit; transition: all 0.2s; outline: none;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: rgba(186,159,117,0.14); border-color: rgba(186,159,117,0.35);
      color: var(--gold);
    }

    .signout-btn {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.18); transition: color 0.2s;
    }
    .signout-btn:hover { color: rgba(255,255,255,0.4); }

    .viewer-body { max-width: 820px; margin: 0 auto; padding: 44px 32px 80px; width: 100%; }

    /* ── Doc styles ── */
    .doc h1 { color: var(--gold); font-size: 20px; font-weight: 700; margin: 0 0 22px; letter-spacing: 0.04em; font-family: inherit; }
    .doc h2 {
      color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 700;
      margin: 38px 0 14px; letter-spacing: 0.12em; text-transform: uppercase;
      border-bottom: 1px solid rgba(186,159,117,0.2); padding-bottom: 8px; font-family: inherit;
    }
    .doc h3 { color: rgba(186,159,117,0.7); font-size: 11px; font-weight: 700; margin: 22px 0 8px; letter-spacing: 0.1em; text-transform: uppercase; font-family: inherit; }
    .doc p { color: rgba(255,255,255,0.55); font-size: 13px; line-height: 1.75; margin: 0 0 12px; }
    .doc hr { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 28px 0; }
    .doc ul { padding-left: 18px; margin: 6px 0 16px; }
    .doc li { color: rgba(255,255,255,0.55); font-size: 13px; line-height: 1.7; margin-bottom: 4px; }
    .doc pre {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 16px 18px; font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace; color: rgba(255,255,255,0.6);
      overflow-x: auto; margin: 12px 0 20px; line-height: 1.65; white-space: pre;
    }
    .doc code {
      background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px;
      font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; color: rgba(255,255,255,0.8);
    }
    .doc pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
    .doc table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; font-size: 13px; }
    .doc th {
      text-align: left; padding: 9px 14px;
      border-bottom: 1px solid rgba(186,159,117,0.25);
      color: var(--gold); font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    }
    .doc td {
      padding: 8px 14px; color: rgba(255,255,255,0.55);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: top; line-height: 1.55;
    }
    .doc strong { color: rgba(255,255,255,0.85); font-weight: 600; }

    @media (max-width: 600px) {
      .viewer-header { padding: 14px 18px; flex-wrap: wrap; gap: 12px; }
      .viewer-body { padding: 28px 18px 60px; }
      .tab-btn { padding: 8px 12px; font-size: 9px; }
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">CURATE</div>
    <div class="auth-subtitle">Engineering Review</div>
    <input class="auth-field" type="text" id="uInput" placeholder="Username" autocomplete="username" />
    <input class="auth-field" type="password" id="pInput" placeholder="Password" autocomplete="current-password" />
    <!-- Shown only when this page is not configured for Supabase sign-in.
         See the DOCS API CREDENTIAL block in the script below. -->
    <input class="auth-field" type="password" id="sInput" placeholder="Admin API Secret" autocomplete="off" style="display:none" />
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" onclick="doLogin()">Access</button>
  </div>
</div>

<!-- ── Viewer ── -->
<div class="viewer" id="viewer">
  <header class="viewer-header">
    <div class="viewer-wordmark">CURATE<span>/ Engineering Review</span></div>
    <div class="tab-strip">
      <button class="tab-btn active" onclick="showTab('readme',this)">README</button>
      <button class="tab-btn" onclick="showTab('architecture',this)">Architecture</button>
      <button class="tab-btn" onclick="showTab('schema',this)">Schema</button>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </header>
  <div class="viewer-body">
    <div class="doc" id="readme"></div>
    <div class="doc" id="architecture" style="display:none"></div>
    <div class="doc" id="schema" style="display:none"></div>
  </div>
</div>

<script>
const API = 'https://api.curatevip.ai';

// ══════════════════════ DOCS API CREDENTIAL ══════════════════════
// The three documents are NOT in this file. They used to be — as JS template
// literals guarded by a username and password written in cleartext a few lines
// from here — so anyone could read the architecture and the full data model
// with `curl https://curatevip.app/review.html`. Those two constants are gone
// and that password must be treated as compromised wherever else it was used.
//
// Content now comes from GET /api/docs/review, behind the API's server-side
// requireAdmin check. requireAdmin accepts exactly two credentials:
//   (a) Authorization: Bearer <Supabase session token> for a member with
//       is_admin = true (preferred), or
//   (b) x-admin-secret: <ADMIN_SCRIPT_SECRET>.
//
// (a) is off by default because this site carries no Supabase configuration of
// its own. To enable it, paste the project URL and the ANON (publishable) key
// below — never the service-role key. With them blank, the page falls back to
// (b): the admin API secret is typed at sign-in, kept in memory for the life of
// the tab, and never written to storage of any kind.
const SUPABASE_URL      = '';
const SUPABASE_ANON_KEY = '';
const USE_SUPABASE      = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

// ── Auth ────────────────────────────────────────────────────
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function supabaseSignIn(email, password) {
  const res = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) return null;
  return data.access_token;
}

async function doLogin() {
  const errEl = document.getElementById('authError');
  const btn   = document.querySelector('.auth-btn');
  errEl.textContent = '';

  const u = document.getElementById('uInput').value.trim();
  const p = document.getElementById('pInput').value;
  const s = USE_SUPABASE ? '' : document.getElementById('sInput').value.trim();
  if (!u || !p) { errEl.textContent = 'Username and password required.'; return; }
  if (!USE_SUPABASE && !s) { errEl.textContent = 'Admin API secret required.'; return; }

  btn.textContent = 'Checking…';
  btn.disabled = true;
  try {
    // Step 1 — a real server-side credential check against admin_credentials,
    // replacing the two hardcoded constants this file used to compare against.
    const res = await fetch(API + '/api/admin-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, passwordHash: await sha256(p) })
    });
    const data = await res.json();
    if (!data.ok) { errEl.textContent = 'Invalid credentials.'; return; }

    // Step 2 — a credential the docs API itself accepts.
    let headers;
    if (USE_SUPABASE) {
      const token = await supabaseSignIn(u, p);
      if (!token) { errEl.textContent = 'Could not establish an admin session.'; return; }
      headers = { 'Authorization': 'Bearer ' + token };
    } else {
      headers = { 'x-admin-secret': s };
    }

    // Step 3 — the API is the gate. Nothing is shown unless it answers 200.
    const err = await renderAll(headers);
    if (err) { errEl.textContent = err; return; }

    document.getElementById('pInput').value = '';
    if (!USE_SUPABASE) document.getElementById('sInput').value = '';
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('viewer').classList.add('active');
  } catch (e) {
    errEl.textContent = 'Could not reach server. Check your connection.';
  } finally {
    btn.textContent = 'Access';
    btn.disabled = false;
  }
}

document.getElementById('pInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const sEl = document.getElementById('sInput');
  if (!USE_SUPABASE && !sEl.value.trim()) { sEl.focus(); return; }
  doLogin();
});
document.getElementById('sInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('sInput').style.display = USE_SUPABASE ? 'none' : '';
document.getElementById('uInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pInput').focus();
});

function signOut() {
  document.getElementById('authScreen').style.display = '';
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('uInput').value = '';
  document.getElementById('pInput').value = '';
  document.getElementById('sInput').value = '';
  document.getElementById('authError').textContent = '';
  // Signing out must leave nothing rendered behind.
  ['readme', 'architecture', 'schema'].forEach(id => {
    document.getElementById(id).innerHTML = '';
  });
  rendered = false;
}

// ── Tab switching ────────────────────────────────────────────
function showTab(id, btn) {
  ['readme','architecture','schema'].forEach(t => {
    document.getElementById(t).style.display = t === id ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Inline renderer ──────────────────────────────────────────
function renderInline(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

// ── Markdown renderer ────────────────────────────────────────
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (line.startsWith('# ')) {
      html += `<h1>${renderInline(line.slice(2))}</h1>`;
      i++;
    } else if (line.startsWith('## ')) {
      html += `<h2>${renderInline(line.slice(3))}</h2>`;
      i++;
    } else if (line.startsWith('### ')) {
      html += `<h3>${renderInline(line.slice(4))}</h3>`;
      i++;
    } else if (line.startsWith('```')) {
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) {
        codeLines.push(lines[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
        i++;
      }
      i++;
      html += `<pre><code>${codeLines.join('\n')}</code></pre>`;
    } else if (line.startsWith('|') && line.trim().length > 1) {
      const tableLines = [];
      while (i < lines.length && lines[i].startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      const rows = tableLines
        .filter(l => !/^\|[\s\-:|]+\|$/.test(l.replace(/ /g, '')))
        .map(l => l.split('|').slice(1, -1).map(c => c.trim()));
      if (rows.length > 0) {
        html += '<div style="overflow-x:auto;margin:12px 0 20px"><table>';
        html += '<thead><tr>' + rows[0].map(c => `<th>${renderInline(c)}</th>`).join('') + '</tr></thead>';
        html += '<tbody>';
        rows.slice(1).forEach(row => {
          html += '<tr>' + row.map(c => `<td>${renderInline(c)}</td>`).join('') + '</tr>';
        });
        html += '</tbody></table></div>';
      }
    } else if (line.trim() === '---') {
      html += '<hr>';
      i++;
    } else if (line.startsWith('- ') || line.startsWith('* ')) {
      html += '<ul>';
      while (i < lines.length && (lines[i].startsWith('- ') || lines[i].startsWith('* '))) {
        html += `<li>${renderInline(lines[i].slice(2))}</li>`;
        i++;
      }
      html += '</ul>';
    } else if (line.trim() === '') {
      i++;
    } else {
      html += `<p>${renderInline(line)}</p>`;
      i++;
    }
  }
  return html;
}

// ── Fetch + render the docs after a successful sign-in ──────
// Returns an error string on failure, null on success. There is no embedded
// copy to fall back to by design: if the API will not serve the content, this
// page shows nothing.
let rendered = false;
async function renderAll(headers) {
  if (rendered) return null;

  let res;
  try {
    res = await fetch(API + '/api/docs/review', { headers, cache: 'no-store' });
  } catch (err) {
    return 'Could not reach the documentation service. Check your connection.';
  }
  if (res.status === 401) return 'Not authorized for documentation access.';
  if (res.status === 403) return 'This account does not have admin access.';
  if (!res.ok)            return 'Documentation is unavailable (error ' + res.status + ').';

  let data;
  try { data = await res.json(); } catch (err) { return 'Documentation response was malformed.'; }
  if (!data || !data.ok || !data.readme || !data.architecture || !data.schema) {
    return 'Documentation response was incomplete.';
  }

  document.getElementById('readme').innerHTML       = renderMarkdown(data.readme);
  document.getElementById('architecture').innerHTML = renderMarkdown(data.architecture);
  document.getElementById('schema').innerHTML       = renderMarkdown(data.schema);
  rendered = true;
  return null;
}
</script>
</body>
</html>
